name: weather.get
description: Get the current weather and the next days' forecast for a given location
version: 1
language: typescript
entrypoint: index.ts

# @streamcore/plugin 0.2.0 from npm has the result envelope the card needs.
# Don't point this at ../plugin-sdk: the server image is built from this repo
# alone, so the path is missing there and the plugin is skipped at startup.
build: ["npm", "install"]

# One HTTPS round trip to wttr.in, which is occasionally slow to answer.
timeout_ms: 10000

parameters:
  type: object
  properties:
    location:
      type: string
      description: "A city name or location to get the weather for (e.g. 'London', 'New York', 'Tokyo')"
  required:
    - location
confirmation_required: false

name: developer
description: "Developer agent: a GitHub App that reads a repository's CI, and the Codex harness that investigates and fixes what it finds."
version: 1

# Off unless an operator asks for it. Both halves need credentials, and a
# deployment that has not set them up must behave exactly as it did before this
# plugin existed. Turn it on with:
#
#   [plugins.config.developer]
#   [plugins.config.developer.github]
#   enabled = true
#   ...
enabled: false

build: ["go", "build", "-o", "developer", "."]
exec: ["./developer"]

# A Codex turn thinks for minutes, and codex.analyze bounds itself at fifteen.
# This is the backstop above those, not the working limit: every tool applies
# its own deadline, and this only catches a wedged App Server.
timeout_ms: 960000

# Tools are declared at startup rather than listed here. Which ones exist
# depends on what is configured — GitHub alone, Codex alone, or both — and the
# pull request tool only appears when there is a Codex task that could produce
# a change to publish.

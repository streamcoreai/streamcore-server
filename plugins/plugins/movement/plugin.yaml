name: movement
description: "Locomotion for whatever client is connected — a two-wheel desktop car, a rigged character in a browser, anything that can go forward and turn. Nothing here names a drivetrain: the server never learns which is on the other end."
version: 1

tools:
  - name: movement.forward
    description: "Move the robot forward. Use when the user asks it to go, move, walk, drive, advance, or come closer."
    dispatch:
      topic: movement.command
      payload:
        action: forward
      omit_zero: true
      speak: "Moving forward."
      speak_when:
        - when:
            continuous: true
          speak: "On my way — say stop when you want me to halt."
    parameters:
      type: object
      properties:
        continuous:
          type: "boolean"
          description: "Set true when the user asks the robot to keep going until told to stop — 'keep walking', 'go until I say stop', 'keep driving'. It then moves until it runs out of room or movement.stop arrives, and duration_ms is ignored. Leave unset for a normal single move."
          default: false
        duration_ms:
          type: "integer"
          description: "How long to keep moving, in milliseconds. Ignored when continuous is true. Clamped to 100..10000."
          default: 1500
          minimum: 100
          maximum: 10000
        speed_percent:
          type: "integer"
          description: "How hard to move, 0..100. Defaults to 80 if omitted."
          default: 80
          minimum: 0
          maximum: 100

  - name: movement.backward
    description: "Move the robot backward. Use when the user asks it to back up, reverse, or move away."
    dispatch:
      topic: movement.command
      payload:
        action: backward
      omit_zero: true
      speak: "Backing up."
      speak_when:

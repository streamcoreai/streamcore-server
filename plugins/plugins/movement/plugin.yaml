  - name: movement.fancy
    description: "Play a short choreographed sequence of fancy moves — alternating pivots and wiggles. Use when the user asks the robot to do fancy moves, show off, dance, party, celebrate, do tricks, or otherwise put on a little show."
    dispatch:
      topic: movement.command
      payload:

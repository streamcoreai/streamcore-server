name: vision.analyze
description: Capture an image from the device camera and analyze it using AI vision. Use this when the user asks about something they can see, wants to identify an object, read text, describe a scene, etc.
version: 1
build: ["npm", "install"]
exec: ["npx", "tsx", "index.ts"]

# The server captures a still from the client and merges image_base64 and
# image_mime into this tool's arguments before it runs. The plugin has no way
# to ask the device for a picture itself.
requires:
  - camera_frame
parameters:
  type: object
  properties:
    question:
      type: string
      description: "The user's question about what they see (e.g. 'What kind of flower is this?', 'Read this sign for me', 'What do you see?')"
  required:
    - question
confirmation_required: false
